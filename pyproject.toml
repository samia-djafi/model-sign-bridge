[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bridge_sign_model"
version = "0.1.0"
description = "Algerian Sign Language (LSA) Recognition & Translation Research Project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "opencv-python>=4.9.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.11.0",
    "pytest>=8.0.0",
    "tqdm>=4.66.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
